<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>家教管理</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="家教管理">
  <meta name="theme-color" content="#4F46E5">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app">
  <!-- ===== 登录页 ===== -->
  <div v-if="page==='login'" class="login-bg">
    <div class="login-box" style="max-width:440px">
      <div class="text-center mb-24"><div class="login-icon">📚</div><h2>家教管理</h2><p class="text-gray">一人公司 · 独立老师 · 家长协同</p></div>

      <!-- 角色选择 -->
      <div class="role-tabs mb-24">
        <div :class="'role-tab '+(authRole==='admin'?'active':'')" @click="authRole='admin'"><div class="role-tab-icon">🏢</div><div>管理员</div></div>
        <div :class="'role-tab '+(authRole==='teacher'?'active':'')" @click="authRole='teacher'"><div class="role-tab-icon">👩‍🏫</div><div>老师</div></div>
        <div :class="'role-tab '+(authRole==='parent'?'active':'')" @click="authRole='parent'"><div class="role-tab-icon">👨‍🎓</div><div>学生/家长</div></div>
      </div>

      <!-- 登录表单 -->
      <template v-if="authMode==='login'">
        <div class="form-group"><label>手机号</label><input class="input" v-model="phone" placeholder="请输入手机号" maxlength="11"></div>
        <div class="form-group"><label>密码</label><input class="input" type="password" v-model="password" placeholder="请输入密码" @keyup.enter="doLogin"></div>
        <button class="btn btn-primary w-full mt-16" @click="doLogin" :disabled="loading">{{loading?'登录中...':'登录'}}</button>
        <div class="login-tips mt-16"><p class="text-sm text-gray">测试：超管 13800000000 / 管理员 13800000001 / 老师 13810000001 / 家长 13810000003</p><p class="text-sm text-gray">密码统一：123456</p></div>
        <hr class="mt-16"><p class="text-center mt-16"><a href="#" @click.prevent="authMode='register'">还没有账号？立即注册 →</a></p>
      </template>

      <!-- 注册表单 -->
      <template v-else>
        <h3 class="mb-4 text-center">{{authRole==='admin'?'🏢 管理员注册':authRole==='teacher'?'👩‍🏫 老师注册':'👨‍🎓 学生/家长注册'}}</h3>
        <p class="text-sm text-gray text-center mb-16">{{authRole==='admin'?'创建培训机构并成为管理员':authRole==='teacher'?'注册老师账号，开始独立教学':'注册账号，管理孩子的学习'}}</p>

        <div class="form-group"><label>姓名 *</label><input class="input" v-model="regName" :placeholder="authRole==='parent'?'家长姓名':'你的姓名'"></div>

        <!-- 家长：学生信息 -->
        <template v-if="authRole==='parent'">
          <div class="form-group"><label>学生姓名 *</label><input class="input" v-model="regStudentName" placeholder="孩子的姓名"></div>
          <div class="form-group"><label>学生年级 *</label><select class="input" v-model="regStudentGrade"><option value="">请选择</option><option v-for="g in grades" :key="g" :value="g">{{g}}</option></select></div>
        </template>

        <div class="form-group"><label>手机号 *</label><input class="input" v-model="phone" placeholder="用于登录" maxlength="11"></div>
        <div class="form-group"><label>密码 *</label><input class="input" type="password" v-model="password" placeholder="至少6位"></div>

        <!-- 管理员：必须填机构名 -->
        <div v-if="authRole==='admin'" class="form-group"><label>机构名称 *</label><input class="input" v-model="regInstName" placeholder="如：星辰教育"></div>

        <!-- 老师和家长：机构名选填 -->
        <div v-if="authRole==='teacher'||authRole==='parent'" class="form-group">
          <label>机构名称 <span class="text-sm text-gray">(选填)</span></label>
          <input class="input" v-model="regInstName" placeholder="没有可以先不填，后续加入">
        </div>

        <button class="btn btn-primary w-full mt-16" @click="doRegister" :disabled="loading">{{loading?'注册中...':'注册'}}</button>
        <hr class="mt-16"><p class="text-center mt-16"><a href="#" @click.prevent="authMode='login'">← 已有账号，去登录</a></p>
      </template>
    </div>
  </div>

  <!-- ===== 主界面 ===== -->
  <div v-else class="app-shell">
    <!-- 顶部导航 -->
    <header class="topbar"><div class="topbar-inner"><span class="logo">📚 {{inst?.name||'家教管理'}}</span><div class="flex-row"><span class="user-info mr-16">{{user?.name}} · {{roleLabel}}</span><button class="btn btn-sm btn-outline" @click="logout">退出</button></div></div></header>

    <div class="main-layout">
      <!-- 侧边栏 -->
      <nav class="sidebar">
        <template v-for="m in menu" :key="m.key">
          <a :class="'nav-item '+(page===m.key?'active':'')" @click="goPage(m.key)">{{m.icon}} {{m.label}}</a>
        </template>
      </nav>

      <!-- 内容区 -->
      <main class="content">

        <!-- ===== 管理员看板 ===== -->
        <template v-if="page==='admin-dashboard'">
          <div class="header-card" style="background:linear-gradient(135deg,#4F46E5,#7C3AED)"><h2>👋 {{user?.name}}，欢迎回来</h2><p style="opacity:0.8">🏢 {{inst?.name||'平台管理'}} · {{today}}</p></div>
          <div class="grid-4 mt-16"><div class="stat-card"><div class="stat-icon">📅</div><div class="stat-val">{{stats.todayCourses||0}}</div><div class="stat-lbl">今日课程</div></div><div class="stat-card"><div class="stat-icon">👩‍🏫</div><div class="stat-val">{{stats.activeTeachers||0}}</div><div class="stat-lbl">活跃老师</div></div><div class="stat-card"><div class="stat-icon">👨‍🎓</div><div class="stat-val">{{stats.totalStudents||0}}</div><div class="stat-lbl">在学学生</div></div><div class="stat-card"><div class="stat-icon">⏱️</div><div class="stat-val">{{stats.monthlyHours||0}}h</div><div class="stat-lbl">本月课时</div></div></div>
          <div class="card mt-16"><h3 class="mb-12">⚠️ 待写反馈 ({{pendingFeedback.length}})</h3><div v-for="c in pendingFeedback" :key="c.id" class="list-item flex-between"><span>{{c.student_name}} · {{c.teacher_name}} · {{c.subject}}</span><button class="btn btn-sm btn-primary" @click="writeFeedback(c)">写反馈</button></div></div>
          <div class="card mt-16"><h3 class="mb-12">最近反馈</h3><div v-for="f in recentFeedbacks" :key="f.id" class="list-item"><span class="text-bold">{{f.title}}</span> {{'⭐'.repeat(f.rating)}} <span class="text-sm text-gray">{{f.student_name}} · {{f.created_at}}</span></div></div>
        </template>

        <!-- ===== 老师管理（管理员） ===== -->
        <template v-if="page==='admin-teachers'">
          <div class="flex-between mb-16"><h2>老师管理 ({{teachers.length}})</h2><button class="btn btn-primary btn-sm" @click="openTeacherForm()">+ 添加</button></div>
          <div v-for="t in teachers" :key="t.id" class="card mb-12"><div class="flex-between"><div><span class="text-bold text-lg">{{t.name}}</span><span :class="'tag '+(t.status==='active'?'tag-green':'tag-red')+' ml-8'">{{t.status==='active'?'在职':'离职'}}</span></div><div><a href="#" @click.prevent="editTeacher(t)" class="mr-12">编辑</a><a href="#" @click.prevent="delTeacher(t)" class="text-danger">删除</a></div></div><div class="mt-8 text-sm text-gray">📱 {{t.user_phone}} | 👨‍🎓 {{t.student_count||0}}个学生 | 📅 {{t.upcoming_courses||0}}节待上</div><div class="mt-8"><span v-for="s in t.subjects" :key="s" class="tag tag-blue">{{s}}</span></div></div>
          <div class="modal" v-if="showTeacherForm"><div class="modal-mask" @click="showTeacherForm=false"></div><div class="modal-box"><h3 class="mb-16">{{editingTeacher?'编辑':'添加'}}老师</h3>
            <div class="form-group"><label>姓名 *</label><input class="input" v-model="tForm.name" placeholder="老师姓名"></div>
            <div class="form-group"><label>手机号 *</label><input class="input" v-model="tForm.phone" placeholder="手机号（登录用）"></div>
            <div v-if="!editingTeacher" class="form-group"><label>密码</label><input class="input" v-model="tForm.password" type="password" placeholder="登录密码"></div>
            <div class="form-group"><label>科目</label><div class="flex-row flex-wrap"><span v-for="s in subjects" :key="s" :class="'tag '+(tForm.subjects.includes(s)?'tag-purple':'')" style="cursor:pointer" @click="tForm.subjects.includes(s)?tForm.subjects=tForm.subjects.filter(x=>x!==s):tForm.subjects.push(s)">{{s}}</span></div></div>
            <div class="form-group"><label>简介</label><input class="input" v-model="tForm.bio" placeholder="如：5年教龄"></div>
            <div class="flex-row"><button class="btn btn-outline flex-1 mr-8" @click="showTeacherForm=false">取消</button><button class="btn btn-primary flex-1" @click="saveTeacher">{{editingTeacher?'保存':'添加'}}</button></div>
          </div></div>
        </template>

        <!-- ===== 学生管理（管理员） ===== -->
        <template v-if="page==='admin-students'">
          <div class="flex-between mb-16"><h2>学生管理 ({{students.length}})</h2><button class="btn btn-primary btn-sm" @click="openStudentForm()">+ 添加</button></div>
          <div v-for="s in students" :key="s.id" class="card mb-12"><div class="flex-between"><div><span class="text-bold text-lg">{{s.name}}</span><span class="tag tag-blue ml-8">{{s.grade}}</span></div><div><a href="#" @click.prevent="editStudent(s)" class="mr-12">编辑</a></div></div><div class="mt-8"><span v-for="sub in s.subjects" :key="sub" class="tag tag-purple">{{sub}}</span></div><div class="mt-8 text-sm text-gray">👩‍🏫 {{s.teacher_name||'未分配'}} | 👨‍👩‍👧 {{s.parent_name||'未关联'}} | 📝 {{s.notes||''}}</div></div>
          <div class="modal" v-if="showStudentForm"><div class="modal-mask" @click="showStudentForm=false"></div><div class="modal-box"><h3 class="mb-16">{{editingStudent?'编辑':'添加'}}学生</h3>
            <div class="form-group"><label>姓名 *</label><input class="input" v-model="sForm.name" placeholder="学生姓名"></div>
            <div class="form-group"><label>年级</label><input class="input" v-model="sForm.grade" placeholder="如：初三"></div>
            <div class="form-group"><label>科目</label><div class="flex-row flex-wrap"><span v-for="s in subjects" :key="s" :class="'tag '+(sForm.subjects.includes(s)?'tag-purple':'')" style="cursor:pointer" @click="sForm.subjects.includes(s)?sForm.subjects=sForm.subjects.filter(x=>x!==s):sForm.subjects.push(s)">{{s}}</span></div></div>
            <div class="form-group"><label>分配老师</label><select class="input" v-model="sForm.teacher_id"><option :value="null">不分配</option><option v-for="t in teachers" :key="t.id" :value="t.id">{{t.name}}</option></select></div>
            <div class="form-group"><label>备注</label><input class="input" v-model="sForm.notes" placeholder="学生薄弱点等"></div>
            <div class="flex-row"><button class="btn btn-outline flex-1 mr-8" @click="showStudentForm=false">取消</button><button class="btn btn-primary flex-1" @click="saveStudent">{{editingStudent?'保存':'添加'}}</button></div>
          </div></div>
        </template>

        <!-- ===== 排课日历 ===== -->
        <template v-if="page==='schedule'">
          <div class="flex-between mb-16"><h2>排课日历</h2><button class="btn btn-primary btn-sm" @click="goPage('schedule-create')">+ 新建排课</button></div>
          <div class="card"><div class="flex-between mb-12"><button class="btn btn-sm btn-outline" @click="prevMonth">◀</button><span class="text-bold text-lg">{{calYear}}年{{calMonth}}月</span><button class="btn btn-sm btn-outline" @click="nextMonth">▶</button></div>
          <div class="cal-grid"><div v-for="d in weekDays" :key="d" class="cal-hd">{{d}}</div>
          <div v-for="(d,i) in calDays" :key="i" :class="'cal-day '+(d.isToday?'today ':'')+(!d.isCurr?'dim ':'')+(d.date===selDate?'sel':'')" @click="selectDate(d.date)"><span>{{d.day}}</span><span v-if="d.hasCourse" class="dot"></span></div></div></div>
          <h3 class="mt-16 mb-8">{{selDate}} 课程 ({{dayCourses.length}})</h3>
          <div v-for="c in dayCourses" :key="c.id" class="card mb-8"><div class="flex-between"><span class="text-bold">{{c.subject}}</span><span :class="'tag '+(c.status==='scheduled'?'tag-green':c.status==='completed'?'tag-blue':'tag-red')">{{c.status==='scheduled'?'待上':c.status==='completed'?'已完成':'已取消'}}</span></div><div class="mt-4 text-sm text-gray">{{c.start_time}}~{{c.end_time}} | 👩‍🏫{{c.teacher_name}} | 👨‍🎓{{c.student_name}} | 📍{{c.location||'-'}}</div></div>
        </template>

        <!-- ===== 新建排课 ===== -->
        <template v-if="page==='schedule-create'">
          <h2 class="mb-16">新建排课</h2>
          <div class="card"><div class="form-group"><label>老师 *</label><select class="input" v-model="courseForm.teacher_id"><option :value="null">请选择</option><option v-for="t in teachers" :key="t.id" :value="t.id">{{t.name}}</option></select></div>
          <div class="form-group"><label>学生 *</label><select class="input" v-model="courseForm.student_id"><option :value="null">请选择</option><option v-for="s in students" :key="s.id" :value="s.id">{{s.name}}</option></select></div>
          <div class="form-group"><label>科目 *</label><input class="input" v-model="courseForm.subject" placeholder="如：数学"></div>
          <div class="form-group"><label>日期 *</label><input class="input" type="date" v-model="courseForm.date"></div>
          <div class="flex-row"><div class="form-group flex-1 mr-8"><label>开始 *</label><input class="input" type="time" v-model="courseForm.start_time"></div><div class="form-group flex-1"><label>结束 *</label><input class="input" type="time" v-model="courseForm.end_time"></div></div>
          <div class="form-group"><label>地点</label><input class="input" v-model="courseForm.location" placeholder="如：教室A"></div>
          <div class="form-group"><label>备注</label><textarea class="input" v-model="courseForm.notes" rows="2" placeholder="教学内容安排"></textarea></div>
          <button class="btn btn-primary w-full" @click="createCourse">确认排课</button></div>
        </template>

        <!-- ===== 老师看板 ===== -->
        <template v-if="page==='teacher-dashboard'">
          <div class="header-card" style="background:linear-gradient(135deg,#059669,#10B981)"><h2>👋 {{user?.name}}老师</h2><p style="opacity:0.8">{{today}}</p></div>
          <div class="grid-4 mt-16"><div class="stat-card"><div class="stat-icon">📅</div><div class="stat-val">{{stats.todayCourses||0}}</div><div class="stat-lbl">今日课程</div></div><div class="stat-card"><div class="stat-icon">👨‍🎓</div><div class="stat-val">{{stats.myStudents||0}}</div><div class="stat-lbl">我的学生</div></div><div class="stat-card"><div class="stat-icon">⏱️</div><div class="stat-val">{{stats.monthlyHours||0}}h</div><div class="stat-lbl">本月课时</div></div><div class="stat-card"><div class="stat-icon">⚠️</div><div class="stat-val">{{stats.pendingFeedbackCount||0}}</div><div class="stat-lbl">待写反馈</div></div></div>
          <div class="card mt-16 ai-entry" style="background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#FFF;cursor:pointer" @click="goPage('lesson-plan')"><div class="flex-between"><div><h3>🤖 AI 自动备课</h3><p style="opacity:0.8">告诉AI学生问题，一键生成教案</p></div><span style="font-size:40rpx">▶</span></div></div>
          <div class="card mt-16"><h3 class="mb-8">📋 今日课表</h3><div v-for="c in todaySchedule" :key="c.id" class="list-item flex-between"><span>{{c.subject}} {{c.start_time?.slice(11,16)}}~{{c.end_time?.slice(11,16)}}</span><span class="text-sm text-gray">{{c.student_name}}</span></div></div>
        </template>

        <!-- ===== AI 备课 ===== -->
        <template v-if="page==='lesson-plan'">
          <div v-if="!planGenerated">
            <div class="card flex-between mb-16"><div><h3>🤖 AI 自动备课</h3><p class="text-sm text-gray">描述学生问题，生成个性化教案</p></div><button class="btn btn-sm btn-outline" @click="goPage('question-bank')">📚 我的题库</button></div>
            <div class="card">
              <div class="form-group"><label>选择学生 *</label><select class="input" v-model="planStudentId"><option :value="null">请选择</option><option v-for="s in students" :key="s.id" :value="s.id">{{s.name}} ({{s.grade}})</option></select></div>
              <div class="form-group"><label>科目 *</label><select class="input" v-model="planSubject"><option v-for="s in subjects" :key="s" :value="s">{{s}}</option></select></div>
              <div class="form-group"><label>课时长（分钟）</label><select class="input" v-model.number="planDuration"><option v-for="d in [60,90,120,150,180]" :key="d" :value="d">{{d}}分钟</option></select></div>
              <div class="form-group"><label>教学目标（选填）</label><input class="input" v-model="planGoals" placeholder="如：掌握二次函数图像画法"></div>
              <div class="form-group"><label>学生问题/薄弱点 *</label><textarea class="input" v-model="planProblems" rows="5" placeholder="详细描述学生的问题，AI会针对性生成教案...&#10;&#10;例如：&#10;• 二次函数图像搞不清楚&#10;• 配方法总是出错&#10;• 计算时经常犯低级错误"></textarea></div>
              <div class="mb-12"><span v-for="t in presetTags" :key="t" class="tag mr-4" style="cursor:pointer" @click="planProblems=planProblems?(planProblems.includes(t)?planProblems:planProblems+'；'+t):t">{{t}}</span></div>
              <button class="btn btn-primary w-full" @click="generatePlan" :disabled="genLoading">{{genLoading?'🤖 AI 正在生成...':'🤖 开始生成教案'}}</button>
            </div>
          </div>
          <div v-else>
            <div class="flex-between mb-16"><button class="btn btn-sm btn-outline" @click="planGenerated=false">◀ 重新生成</button><button class="btn btn-sm btn-primary" @click="usePlanForSchedule">📅 用于排课</button></div>
            <div class="card" style="background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#FFF"><h3>{{plan.title}}</h3><p style="opacity:0.9">👨‍🎓 {{selStudent?.name}} | 📖 {{planSubject}} | ⏱️ {{planDuration}}分钟</p></div>
            <div class="card mt-16"><h4 class="mb-8">🎯 教学目标</h4><div v-for="(o,i) in plan.teachingObjectives" :key="i" class="obj-row"><span class="obj-num">{{i+1}}</span><span>{{o}}</span></div></div>
            <div class="flex-row mt-16"><div class="card flex-1 mr-8"><h4 style="color:#22C55E">✅ 重点</h4><p v-for="k in plan.keyPoints" :key="k" class="text-sm">• {{k}}</p></div><div class="card flex-1"><h4 style="color:#EF4444">⚠️ 难点</h4><p v-for="d in plan.difficultPoints" :key="d" class="text-sm">• {{d}}</p></div></div>
            <div class="card mt-16"><h4 class="mb-12">📋 教学流程</h4><div v-for="s in plan.steps" :key="s.phase" class="step-row"><div class="flex-between"><span class="text-bold">{{s.phase}}</span><span class="step-time">⏱ {{s.duration}}分钟</span></div><p class="text-sm mt-4">{{s.content}}</p><div v-if="s.tips" class="step-tip mt-4">💡 {{s.tips}}</div></div></div>
            <div class="card mt-16"><div class="flex-between mb-12"><h4>✏️ 课堂练习</h4><span v-if="plan.exercises&&plan.exercises[0]&&plan.exercises[0].fromBank" class="tag tag-green">📚 来自题库</span></div><div v-for="(ex,i) in plan.exercises" :key="i" class="ex-item"><p class="text-bold">题{{i+1}}：{{ex.question}}</p><div class="ex-answer mt-4">答案：{{ex.answer}}</div><div class="mt-4"><span class="tag tag-purple">{{ex.purpose}}</span><span v-if="ex.source==='teacher'" class="tag tag-orange ml-4">🔒 我的题库</span><span v-else-if="ex.fromBank" class="tag tag-green ml-4">📚 系统题库</span></div></div></div>
            <div class="card mt-16"><h4 class="mb-8">📝 课堂总结</h4><p class="text-sm">{{plan.summary}}</p></div>
            <div class="card mt-16"><h4 class="mb-8">📚 课后作业</h4><p class="text-sm" style="white-space:pre-line">{{plan.homework}}</p></div>
            <div class="card mt-16"><h4 class="mb-8">🔮 下节课预告</h4><p class="text-sm">{{plan.nextPreview}}</p></div>
          </div>
        </template>

        <!-- ===== 我的题库（老师） ===== -->
        <template v-if="page==='question-bank'">
          <div class="flex-between mb-16"><h2>📚 我的题库 ({{myQuestions.length}})</h2><div><button class="btn btn-sm btn-outline mr-8" @click="triggerImport">📥 导入</button><button class="btn btn-primary btn-sm" @click="openQForm()">+ 添加</button></div></div>
          <div class="flex-row mb-16"><select class="input mr-8" v-model="qbFilterSubject" @change="loadMyQuestions"><option value="">全部科目</option><option v-for="s in subjects" :key="s" :value="s">{{s}}</option></select><select class="input" v-model="qbFilterGrade" @change="loadMyQuestions"><option value="">全部年级</option><option v-for="g in grades" :key="g" :value="g">{{g}}</option></select></div>
          <div v-for="q in myQuestions" :key="q.id" class="card mb-8"><div class="flex-between mb-4"><span class="tag tag-purple">{{q.subject}}·{{q.grade}}</span><span class="tag tag-blue">{{q.topic||'未分类'}}</span></div><p class="text-bold">{{q.question}}</p><div class="ex-answer mt-4">答案：{{q.answer}}</div><div class="flex-between mt-4"><div><span class="tag tag-orange">难度：{{'⭐'.repeat(q.difficulty)}}</span><span class="tag tag-green ml-4">🔒 私有</span></div><div><a href="#" @click.prevent="editQ(q)" class="mr-12">编辑</a><a href="#" @click.prevent="delQ(q)" class="text-danger">删除</a></div></div></div>
          <div class="modal" v-if="showQForm"><div class="modal-mask" @click="showQForm=false"></div><div class="modal-box"><h3 class="mb-16">{{editingQ?'编辑':'添加'}}题目</h3>
            <div class="flex-row"><div class="form-group flex-1 mr-8"><label>科目 *</label><select class="input" v-model="qForm.subject"><option value="">请选择</option><option v-for="s in subjects" :key="s" :value="s">{{s}}</option></select></div><div class="form-group flex-1"><label>年级 *</label><select class="input" v-model="qForm.grade"><option value="">请选择</option><option v-for="g in grades" :key="g" :value="g">{{g}}</option></select></div></div>
            <div class="form-group"><label>知识点</label><input class="input" v-model="qForm.topic" placeholder="如：二次函数"></div>
            <div class="form-group"><label>难度</label><div class="flex-row"><span v-for="i in 5" :key="i" style="font-size:28px;cursor:pointer;opacity:0.3" :style="{opacity:qForm.difficulty>=i?1:0.3}" @click="qForm.difficulty=i">⭐</span></div></div>
            <div class="form-group"><label>题目内容 *</label><textarea class="input" v-model="qForm.question" rows="3" placeholder="请输入题目"></textarea></div>
            <div class="form-group"><label>参考答案 *</label><textarea class="input" v-model="qForm.answer" rows="2" placeholder="请输入答案或解析"></textarea></div>
            <div class="form-group"><label>标签（逗号分隔）</label><input class="input" v-model="qForm.tags" placeholder="如：计算,基础,方程"></div>
            <div class="flex-row"><button class="btn btn-outline flex-1 mr-8" @click="showQForm=false">取消</button><button class="btn btn-primary flex-1" @click="saveQ">{{editingQ?'保存':'添加'}}</button></div>
          </div></div>

          <!-- 导入弹窗 -->
          <div class="modal" v-if="showImport"><div class="modal-mask" @click="closeImport"></div><div class="modal-box" style="max-width:700px">
            <h3 class="mb-16">📥 批量导入题目</h3>

            <!-- 步骤1：选择文件 -->
            <div v-if="importStep===1">
              <div class="import-dropzone" @click="$refs.fileInput.click()" @dragover.prevent @drop.prevent="onDrop">
                <div class="text-center">
                  <div style="font-size:48px;margin-bottom:8px">📂</div>
                  <p class="text-bold mb-4">点击选择文件 或 拖拽文件到此处</p>
                  <p class="text-sm text-gray">支持 .csv / .json 文件，最大 5MB</p>
                </div>
                <input ref="fileInput" type="file" accept=".csv,.json" @change="onFileSelect" style="display:none">
              </div>
              <div class="mt-12 text-center">
                <a href="#" @click.prevent="downloadTemplate" class="text-sm">📋 下载 CSV 模板</a>
              </div>
            </div>

            <!-- 步骤2：预览 -->
            <div v-else-if="importStep===2">
              <div class="flex-between mb-12">
                <span class="text-bold">📋 解析结果</span>
                <span class="tag tag-green">有效 {{importPreview.valid}} 条</span>
                <span v-if="importPreview.skipped>0" class="tag tag-orange">跳过 {{importPreview.skipped}} 条</span>
              </div>
              <div class="import-preview-table">
                <table>
                  <thead><tr><th>#</th><th>科目</th><th>年级</th><th>知识点</th><th>题目</th><th>答案</th><th>难度</th></tr></thead>
                  <tbody>
                    <tr v-for="(q,i) in importPreview.preview" :key="i">
                      <td>{{i+1}}</td>
                      <td>{{q.subject||'-'}}</td>
                      <td>{{q.grade||'-'}}</td>
                      <td>{{q.topic||'-'}}</td>
                      <td class="text-sm" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{q.question}}</td>
                      <td class="text-sm" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{q.answer}}</td>
                      <td>{{q.difficulty||3}}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="flex-row mt-16">
                <button class="btn btn-outline flex-1 mr-8" @click="importStep=1">← 重新选择</button>
                <button class="btn btn-primary flex-1" @click="confirmImport" :disabled="importing">
                  {{importing ? '导入中...' : '✅ 确认导入 ' + importPreview.valid + ' 道题目'}}
                </button>
              </div>
            </div>

            <!-- 步骤3：完成 -->
            <div v-else-if="importStep===3">
              <div class="text-center" style="padding:32px 0">
                <div style="font-size:56px;margin-bottom:12px">🎉</div>
                <h3 class="mb-8">导入完成！</h3>
                <p class="mb-4">成功导入 <span class="text-bold" style="color:#22C55E">{{importResult.imported}}</span> 道题目</p>
                <p v-if="importResult.skipped>0" class="text-sm text-gray">跳过 {{importResult.skipped}} 条无效数据</p>
                <button class="btn btn-primary mt-16" @click="closeImport">完成</button>
              </div>
            </div>
          </div></div>
        </template>

        <!-- ===== 反馈列表 ===== -->
        <template v-if="page==='feedbacks'">
          <h2 class="mb-16">反馈列表 ({{feedbacks.length}})</h2>
          <div v-for="f in feedbacks" :key="f.id" class="card mb-8"><div class="flex-between"><span class="text-bold">{{f.title}}</span><span>{{'⭐'.repeat(f.rating)}}</span></div><div class="mt-4 text-sm text-gray">👨‍🎓 {{f.student_name}} | 👩‍🏫 {{f.teacher_name}} | 🕐 {{f.created_at}}</div><p class="mt-8 text-sm">{{f.content}}</p><div class="mt-4"><span v-if="f.highlights" class="tag tag-green mr-4">🌟 {{f.highlights}}</span><span v-if="f.areas_to_improve" class="tag tag-orange">📝 {{f.areas_to_improve}}</span></div></div>
        </template>

        <!-- ===== 家长看板 ===== -->
        <template v-if="page==='parent-dashboard'">
          <div class="header-card" style="background:linear-gradient(135deg,#F59E0B,#D97706)"><h2>👋 {{user?.name}}</h2><p style="opacity:0.8">家长看板</p></div>
          <div class="grid-4 mt-16"><div class="stat-card"><div class="stat-icon">📅</div><div class="stat-val">{{stats.upcomingCourses||0}}</div><div class="stat-lbl">待上课</div></div><div class="stat-card"><div class="stat-icon">✅</div><div class="stat-val">{{stats.completedCourses||0}}</div><div class="stat-lbl">已完成</div></div><div class="stat-card"><div class="stat-icon">📝</div><div class="stat-val">{{stats.feedbackCount||0}}</div><div class="stat-lbl">反馈数</div></div><div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-val">{{stats.avgRating||0}}</div><div class="stat-lbl">平均评分</div></div></div>
          <div class="card mt-16"><h3 class="mb-8">📋 近期课程</h3><div v-for="c in recentCourses" :key="c.id" class="list-item flex-between"><span class="text-bold">{{c.subject}}</span><span class="text-sm text-gray">{{c.start_time}} | {{c.teacher_name}}</span></div></div>
          <div class="card mt-16"><h3 class="mb-8">📝 最近反馈</h3><div v-for="f in recentFeedbacks" :key="f.id" class="list-item"><span class="text-bold">{{f.title}}</span> {{'⭐'.repeat(f.rating)}} <span class="text-sm text-gray">{{f.created_at}}</span><p class="text-sm mt-4">{{f.content}}</p></div></div>
        </template>

      </main>
    </div>
  </div>
</div>

<script>
// 注册 Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
<script src="/js/app.js"></script>
</body>
</html>
